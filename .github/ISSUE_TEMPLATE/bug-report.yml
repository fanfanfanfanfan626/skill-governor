name: Bug report
description: Report a reproducible CLI, audit, state, rollback, or instruction problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, absolute personal paths, private inventories, policies, and evidence before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a full commit SHA
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Agent host and version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: python --version, or not applicable
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include a minimal sanitized command or request.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
